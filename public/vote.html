<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vote - Snack Poll</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .poll-container {
      background: white;
      border-radius: 12px;
      padding: 32px;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
    }

    h2 {
      color: #333;
      margin-bottom: 8px;
      font-size: 24px;
    }

    .deadline {
      color: #666;
      font-size: 14px;
      margin-bottom: 24px;
    }

    .options-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .option {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      transition: all 0.2s;
    }

    .option:not(.selected):hover {
      border-color: #667eea;
      background: #f8f9ff;
    }

    .option.selected {
      border-color: #667eea;
      background: #f0f3ff;
    }

    .option-text {
      font-size: 16px;
      color: #333;
      font-weight: 500;
    }

    .vote-button {
      background: #667eea;
      color: white;
      border: none;
      padding: 8px 20px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .vote-button:hover {
      background: #5568d3;
      transform: translateY(-1px);
    }

    .vote-button:active {
      transform: translateY(0);
    }

    .voted-message {
      background: #e8f5e9;
      color: #2e7d32;
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 16px;
      font-weight: 600;
      text-align: center;
    }

    .your-vote {
      color: #667eea;
      font-weight: 600;
      font-size: 14px;
    }

    .message {
      margin-top: 20px;
      padding: 12px;
      border-radius: 6px;
      font-weight: 500;
      text-align: center;
      display: none;
    }

    .message.success {
      display: block;
      background: #e8f5e9;
      color: #2e7d32;
    }

    .message.error {
      display: block;
      background: #ffebee;
      color: #c62828;
    }

    .error {
      color: #c62828;
      padding: 20px;
      text-align: center;
      background: #ffebee;
      border-radius: 8px;
    }

    .loading {
      text-align: center;
      color: #666;
      padding: 40px;
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="loading">Loading poll...</div>
  </div>

  <script src="/app/lib/voting.js"></script>
  <script>
    // Get poll ID from URL query parameter
    const urlParams = new URLSearchParams(window.location.search);
    const pollId = urlParams.get('poll') || 'poll-1'; // Default to poll-1 for demo

    // Initialize voting manager
    const apiBaseUrl = window.location.origin;
    const votingManager = new VotingManager(apiBaseUrl);

    // Load the poll
    const appContainer = document.getElementById('app');
    votingManager.loadPoll(pollId, appContainer);
  </script>
</body>
</html>
